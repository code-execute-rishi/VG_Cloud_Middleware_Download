services:
  postgres:
    image: postgres:15
    container_name: vyom-postgres
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $DB_USER"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  backend:
    image: ghcr.io/raunak0713/vyom-go-backend
    container_name: vyom-go-backend
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8080"
    restart: always

  nginx:
    image: nginx:latest
    container_name: vyom-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    restart: always

  watchtower:
    image: nickfedor/watchtower:latest
    container_name: vyom-watchtower
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ~/.docker/config.json:/config.json:ro
    command: --interval 60 --cleanup vyom-go-backend

volumes:
  postgres_data: