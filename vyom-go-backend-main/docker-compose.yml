version: '3.8'

services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: vyom
      POSTGRES_PASSWORD: secure_drone_pass
      POSTGRES_DB: vyom
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: .
    restart: always
    # expose 8080 internally, but map it externally too just in case
    ports:
      - "8080:8080"
    depends_on:
      - db
    env_file:
      - .env.backend
    environment:
      - ENV=production
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=vyom
      - DB_PASSWORD=secure_drone_pass
      - DB_NAME=vyom

  nginx:
    image: nginx:latest
    container_name: vyom-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    restart: always

volumes:
  pgdata:
