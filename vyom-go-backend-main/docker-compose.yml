version: '3.8'

services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: vyom
      POSTGRES_PASSWORD: secure_drone_pass
      POSTGRES_DB: vyom
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: .
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - db
    env_file:
      - .env.backend
    environment:
      - ENV=production
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=vyom
      - DB_PASSWORD=secure_drone_pass
      - DB_NAME=vyom
      # These will be overridden by .env.backend if present, 
      # but we rely on .env.backend primarily for CLERK and LIVEKIT keys.
      # DB connection details are hardcoded above to ensure internal connectivity.

volumes:
  pgdata: